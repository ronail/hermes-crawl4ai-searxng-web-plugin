[project]
name = "crawl4ai-searxng"
version = "1.0.0"
description = "crawl4ai browser extraction + on-demand local SearXNG search for Hermes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ronail" }]
keywords = ["hermes", "web", "crawl4ai", "searxng", "extraction", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# crawl4ai specifically must never be declared here, as a dependency or as an
# extra. It pins snowballstemmer~=2.2 (<3), while Hermes core pins
# snowballstemmer==3.1.1 for python>=3.14, and PM provisions Python 3.14. PM
# resolves the plugin member together with the rest of the candidate set, so
# either form makes `hermes plugins enable` refuse the plugin as unsatisfiable:
#
#   crawl4ai-searxng[crawl4ai] depends on crawl4ai>=0.5.0, we can conclude
#   that hermes-agent and crawl4ai-searxng[crawl4ai] are incompatible
#
# ([tool.hermes] opt-in-extras is not enough: PM's default "all" selection
# still reaches a declared extra. Verified against PM, not inferred.)
#
# The crawl4ai provider degrades instead of blocking: it registers and reports
# is_available()==False until you install it yourself.
#
# httpx IS declared: searxng_provider imports it at call time, and its
# dependency tree is conflict-free with Hermes core.
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ronail/hermes-crawl4ai-searxng-web-plugin"
Repository = "https://github.com/ronail/hermes-crawl4ai-searxng-web-plugin"
Issues = "https://github.com/ronail/hermes-crawl4ai-searxng-web-plugin/issues"

# Optional pip install route. The primary route is
# `hermes plugins install ronail/hermes-crawl4ai-searxng-web-plugin`, which
# clones this repo; the entry point additionally makes the plugin discoverable
# when the distribution is present in the environment.
[project.entry-points."hermes_agent.plugins"]
crawl4ai-searxng = "crawl4ai_searxng"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The repository root IS the plugin directory (plugin.yaml + __init__.py sit
# side by side, which is what `hermes plugins validate` requires). Map the
# package name onto that same root so the optional pip route ships the same
# files rather than a second copy.
packages = ["crawl4ai_searxng"]

[tool.setuptools.package-dir]
crawl4ai_searxng = "."

[tool.setuptools.package-data]
crawl4ai_searxng = ["plugin.yaml"]
