name: crawl4ai-searxng
version: 1.0.0
description: "crawl4ai browser extraction + on-demand local SearXNG search. Two local web backends, no API keys, no hosted services."
author: ronail
kind: backend
license: MIT
homepage: https://github.com/ronail/hermes-crawl4ai-searxng-web-plugin

# This plugin manages no dependencies of its own: crawl4ai is installed
# out-of-band (see pip_dependencies below) and searxng-local needs nothing.
# Declaring python_runtime: external keeps it out of the shared venv union,
# so the same plugin can be installed in the default home and in several
# profiles at once — a member joined twice would declare one [project] name
# twice and fail `uv lock`. See docs/development.md#multi-profile-installs.
python_runtime: external

# Provider names registered by register(ctx) — must match each provider's
# `name` property, since these are the ids used in web.search_backend /
# web.extract_backend / web.backend config keys.
provides_web_providers:
  - crawl4ai
  - searxng-local

# No pip_dependencies, deliberately.
#
# crawl4ai cannot be declared here either. It pins snowballstemmer~=2.2 (<3)
# while Hermes core pins snowballstemmer==3.1.1 for python>=3.14, and PM
# provisions Python 3.14 — declaring it makes PM refuse to install this plugin
# at all, taking the working search provider down with the broken extract one.
#
# The crawl4ai provider degrades on its own: it registers, and
# is_available() reports False until crawl4ai is installed out-of-band
# (`pip install crawl4ai && crawl4ai install`). searxng-local needs nothing.
pip_dependencies: []

# No credentials required. SEARXNG_DIR is optional (it only relocates the
# checkout), so it is not gated here — a missing value just falls back to
# ~/Projects/searxng.
optional_env:
  - key: SEARXNG_DIR
    description: Path to your SearXNG checkout (defaults to ~/Projects/searxng)
    required: false

tags:
  - web
  - local
  - extraction
  - search
